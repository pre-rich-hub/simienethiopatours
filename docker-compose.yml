# Local development Postgres for API-up pairing and P4 staging rehearsal.
# Does not invent staging hostnames — use with backend/.env from .env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gst-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gst
      POSTGRES_PASSWORD: gst
      POSTGRES_DB: gondar_simien_tours
    volumes:
      - gst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst -d gondar_simien_tours"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gst_pgdata:
